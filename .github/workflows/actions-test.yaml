# Tests the shared actions in actions/. Each job runs an action and compares
# the result with what's expected. Expected failures use continue-on-error
# plus the assert-step-failed action.
#
# This repo has no releases (its type is "no releases"), and the tests make
# none: test-publish-pre-release uses a fake gh that keeps releases in a file.

name: actions-test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at the start of the UTC day, to catch breakage from changes in
    # the runners or in the tools the actions use (gh, jq, ClamAV, npm).
    - cron: "0 0 * * *"

permissions:
  contents: read

# A newer run for the same branch or PR replaces an older one.
concurrency:
  group: actions-test-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -- start-pre-release: tags, BUILD-INFO.json (standard fields, extras
  # -- after the description), environment, outputs and the artifact.
  test-start-pre-release:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.start.outputs.release-tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Start a pre-release
        id: start
        uses: ./actions/start-pre-release
        with:
          package-name: test-package
          description: A test package.
          extra-fields: '{"test-version": "1.2.3"}'

      - name: Check BUILD-INFO.json, the environment and the outputs
        env:
          OUT_RELEASE: ${{ steps.start.outputs.release-tag }}
          OUT_PACKAGE: ${{ steps.start.outputs.package-tag }}
        run: |
          set -euo pipefail
          cat BUILD-INFO.json
          today="$(date -u +%Y-%m-%d)"
          jq -e --arg t "$today" '."release-tag" == $t' BUILD-INFO.json
          jq -e --arg t "${today//-/}" '."package-tag" == $t' BUILD-INFO.json
          jq -e '."test-version" == "1.2.3" and ."package-name" == "test-package"' BUILD-INFO.json
          jq -e --arg c "$GITHUB_SHA" '."repo-commit" == $c' BUILD-INFO.json
          [ "$(jq -r 'keys_unsorted | .[0:3] | join(",")' BUILD-INFO.json)" = "package-name,description,test-version" ]
          [ "$RELEASE_TAG" = "$today" ] && [ "$PACKAGE_TAG" = "${today//-/}" ]
          [ "$REPO" = "$GITHUB_REPOSITORY" ] && [ "$REPO_COMMIT" = "$GITHUB_SHA" ]
          [ "$OUT_RELEASE" = "$today" ] && [ "$OUT_PACKAGE" = "${today//-/}" ]
          # The build info table the action adds to the run's summary page
          # (each step has its own summary file, so the action keeps a copy).
          cat "$RUNNER_TEMP/build-info.md"
          grep -q '^## Build info$' "$RUNNER_TEMP/build-info.md"
          grep -qF '| `package-name` | `test-package` |' "$RUNNER_TEMP/build-info.md"
          grep -qF '| `test-version` | `1.2.3` |' "$RUNNER_TEMP/build-info.md"
          grep -q '| `repo-commit` | \[`'"$GITHUB_SHA"'`\](' "$RUNNER_TEMP/build-info.md"

  # -- read-build-info: the artifact from start-pre-release, the platform,
  # -- and the environment.
  test-read-build-info:
    needs: test-start-pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Read the build info
        uses: ./actions/read-build-info
        with:
          platform: darwin-arm64

      - name: Check it
        run: |
          set -euo pipefail
          cat BUILD-INFO.json
          jq -e '."target-platform" == "darwin-arm64" and ."package-name" == "test-package"' BUILD-INFO.json
          [ "$RELEASE_TAG" = "${{ needs.test-start-pre-release.outputs.release-tag }}" ]
          [ "$REPO_COMMIT" = "$GITHUB_SHA" ] && [ -n "$PACKAGE_TAG" ] && [ -n "$REPO" ]
          [ ! -e _build-info ]

  # -- Test action check-platform
  # -- list-config-channels: one channel per config file, sorted, without
  # -- channels.jsonc, from the newest version folder; fails without one.
  test-list-config-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Make fixture configs
        run: |
          mkdir -p fixture/logix-x/001 fixture/logix-x/002 fixture/logix-y/001
          touch fixture/logix-x/001/channels.jsonc fixture/logix-x/001/prod.jsonc
          touch fixture/logix-x/002/channels.jsonc fixture/logix-x/002/prod.jsonc fixture/logix-x/002/dev.jsonc
          touch fixture/logix-y/001/channels.jsonc

      - name: List the newest version folder's channels
        id: list
        uses: ./actions/list-config-channels
        with:
          folder: fixture
          product: logix-x

      - name: Check them
        env:
          CHANNELS: ${{ steps.list.outputs.channels }}
          VERSION: ${{ steps.list.outputs.version-folder }}
        run: |
          [[ "$CHANNELS" == '["dev","prod"]' ]] || { echo "::error::channels: $CHANNELS"; exit 1; }
          [[ "$VERSION" == fixture/logix-x/002 ]] || { echo "::error::version folder: $VERSION"; exit 1; }

      # NOTE: Having this step failing is the expected and normal behavior.
      - name: List a folder with no config file
        id: no-config
        continue-on-error: true
        uses: ./actions/list-config-channels
        with:
          folder: fixture
          product: logix-y

      - name: Assert that previous step failed
        uses: ./actions/assert-step-failed
        with:
          outcome: ${{ steps.no-config.outcome }}
          error-message: "Listing a version folder without config files did not fail"

  test-check-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Test platform match
        uses: ./actions/check-platform
        with:
          os: linux
          arch: x86_64

      # NOTE: Having this step failing is the expected and normal behavior.
      # Ignore the failure annotation that it leaves with in the workflow logs.
      - name: Test platform mismatch
        id: platform-mismatch
        continue-on-error: true
        uses: ./actions/check-platform
        with:
          os: xyz
          arch: x86_64

      - name: Assert that previous step failed
        uses: ./actions/assert-step-failed
        with:
          outcome: ${{ steps.platform-mismatch.outcome }}
          error-message: "The previous step did not fail as expected"


  # -- check-remote-config: the checker on every case (with a fake gh that
  # -- answers from fixture releases), then the action itself, passing on a
  # -- good config and on a pre-release, failing on one with require-stable.
  # -- repos-janitor: every check against a fixture org, with a fake gh.
  test-repos-janitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Run the janitor's tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0
          PATH="$RUNNER_TEMP/venv/bin:$PATH" tests/repos-janitor/run.sh

      - name: Run the tests of the release cleanup's referenced tags
        run: tests/referenced-tags/run.sh

  test-check-remote-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Run the checker's tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0
          PATH="$RUNNER_TEMP/venv/bin:$PATH" tests/check-remote-config/run.sh

      - name: Use the fake gh in the next steps
        run: |
          echo "$GITHUB_WORKSPACE/tests/check-remote-config/fake-gh" >> "$GITHUB_PATH"
          echo "FAKE_GH_RELEASES=$GITHUB_WORKSPACE/tests/check-remote-config/releases" >> "$GITHUB_ENV"

      - name: Check a good config
        uses: ./actions/check-remote-config
        with:
          folder: tests/check-remote-config/cases/good/remote-config
          platforms: darwin-arm64 linux-x86-64

      - name: Check a dev config naming a pre-release, allowed there
        uses: ./actions/check-remote-config
        with:
          folder: tests/check-remote-config/cases/prerelease/remote-config
          platforms: darwin-arm64

      - name: Check a prod config naming a pre-release
        id: prerelease
        continue-on-error: true
        uses: ./actions/check-remote-config
        with:
          folder: tests/check-remote-config/cases/prod-only-prerelease/remote-config
          platforms: darwin-arm64

      - name: Assert that the pre-release was refused
        uses: ./actions/assert-step-failed
        with:
          outcome: ${{ steps.prerelease.outcome }}
          error-message: "A prod config naming a pre-release passed the check"


  # -- Test action scan-files-for-viruses
  test-scan-files-for-viruses:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - scenario: clean
            data: I am clean
            expected: success
          - scenario: dirty
            data: X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*
            expected: failure

    name: Test scan-files-for-viruses (${{ matrix.scenario }})

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Create a file with no virus
        run: |
          echo 'hello world' > good.txt
          cat -n good.txt

      # The dirty data which triggers the virus scanner is based on
      # https://en.wikipedia.org/wiki/EICAR_test_file
      - name: Create a file with a potential virus
        run: |
          echo '${{matrix.data}}' > suspect.txt
          cat -n suspect.txt

      - name: Scan for viruses
        id: virus-scan
        continue-on-error: true
        uses: ./actions/scan-files-for-viruses
        with:
          file-patterns: good.* suspect.*

      - name: Assert scan outcome matches expectation
        # if: always()  # Ensures this runs even if the scan step failed
        run: |
          ACTUAL_OUTCOME="${{ steps.virus-scan.outcome }}"
          echo "ACTUAL_OUTCOME: [$ACTUAL_OUTCOME]"

          EXPECTED_OUTCOME="${{ matrix.expected }}"
          echo "EXPECTED_OUTCOME: [$EXPECTED_OUTCOME]"

          if [ "$ACTUAL_OUTCOME" != "$EXPECTED_OUTCOME" ]; then
            echo "Error: Expected scan outcome '$EXPECTED_OUTCOME' but got '$ACTUAL_OUTCOME' (scenario: ${{ matrix.scenario }})." >&2
            exit 1
          fi

          echo "Scan outcome correct: $ACTUAL_OUTCOME (expected $EXPECTED_OUTCOME)."

  # -- publish-pre-release: the release text, the files, replacing a
  # -- same-tag pre-release, protecting a stable one, and the cleanup. With a
  # -- fake gh (tests/publish-pre-release/fake-gh) that keeps the releases in
  # -- a JSON file, so the tests make no real releases: this repo has none
  # -- (its type is "no releases"). The product repos' daily builds run the
  # -- action against GitHub every day, and repos-janitor checks the result.
  test-publish-pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAKE_GH_STATE: ${{ github.workspace }}/_fake-releases.json
      # The cleanup's referenced tags: a fixture org where logix-ide's
      # dev.jsonc names this repo's test release p1.
      FAKE_GH_ORG: ${{ github.workspace }}/tests/publish-pre-release/org
      GH_TOKEN: unused

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Use the fake gh in the next steps
        run: echo "$GITHUB_WORKSPACE/tests/publish-pre-release/fake-gh" >> "$GITHUB_PATH"

      - name: Make the files of release a
        run: |
          jq -n --arg c "$GITHUB_SHA" \
            '{"package-name": "test", "description": "Test.", "release-tag": "a", "repo-commit": $c}' > BUILD-INFO.json
          echo "Asset one" > asset.txt
          echo "Our own content, first." > content.md

      - name: Publish release a
        uses: ./actions/publish-pre-release
        with:
          title: "Test: A test release."
          links: "[Main page](https://www.openlogix.org/)"
          engine-note: core
          content-file: content.md
          about-bullets: A repo-specific bullet.
          files: asset.txt

      - name: Check release a
        run: |
          set -euo pipefail
          gh release view a --json isPrerelease,name,body,assets,target > release.json
          jq -e '.isPrerelease == true' release.json
          jq -e '[.assets[].name] | sort == ["BUILD-INFO.json", "SHA256SUMS", "asset.txt"]' release.json
          # The tag names the commit that was built.
          jq -e --arg c "$GITHUB_SHA" '.target == $c' release.json
          jq -r .body release.json > body.md
          cat body.md
          # The sections, in order.
          grep -n -e '^\*\*Test: A test release.\*\*$' -e '^\[Main page\]' -e 'Use it through Logix Engine' \
            -e '^Our own content' -e '^### Build info' -e '^### About these releases' -e '^### Checksums' body.md |
            cut -d: -f1 > order.txt
          [ "$(sort -n order.txt | tr '\n' ' ')" = "$(cat order.txt | tr '\n' ' ')" ] && [ "$(wc -l < order.txt)" -eq 7 ]
          source actions/release-policy.sh
          grep -q "The $PRERELEASE_KEEP newest are kept, and older ones while an Open Logix remote config names them" body.md
          grep -q -- "- A repo-specific bullet." body.md
          grep -q "$(sha256sum asset.txt | cut -c1-64)  asset.txt" body.md

      - name: Change the content
        run: echo "Our own content, second." > content.md

      - name: Publish release a again, from scratch
        uses: ./actions/publish-pre-release
        with:
          title: "Test: A test release."
          content-file: content.md
          files: asset.txt

      - name: Check release a was replaced
        run: |
          gh release view a --json body --jq .body > body.md
          grep -q "Our own content, second." body.md
          ! grep -q "Our own content, first." body.md
          [ "$(gh release list --json tagName --jq '[.[] | select(.tagName == "a")] | length')" = 1 ]

      - name: Make a stable release, stable
        run: |
          gh release create stable --title stable --notes "Test" --latest=false
          jq '."release-tag" = "stable"' BUILD-INFO.json > b.json && mv b.json BUILD-INFO.json

      - name: Publish over the stable release
        id: over-stable
        continue-on-error: true
        uses: ./actions/publish-pre-release
        with:
          title: "Test: A test release."
          files: asset.txt

      - name: Assert that the stable release was protected
        uses: ./actions/assert-step-failed
        with:
          outcome: ${{ steps.over-stable.outcome }}
          error-message: "Publishing over a stable release did not fail as expected"

      - name: Check the stable release is still stable
        run: gh release view stable --json isPrerelease --jq '.isPrerelease == false' | grep -q true

      # The cleanup keeps the newest pre-releases by the policy (this test
      # assumes 5), any a remote config names (p1, in the fixture org), and
      # leaves stable releases and drafts.
      - name: Make 6 more pre-releases and a draft
        run: |
          for i in 1 2 3 4 5 6; do
            gh release create "p$i" --title "p$i" --notes "Test" --prerelease
          done
          gh release create draft --title draft --notes "Test" --prerelease --draft
          jq '."release-tag" = "b"' BUILD-INFO.json > b.json && mv b.json BUILD-INFO.json

      - name: Publish release b, the newest
        uses: ./actions/publish-pre-release
        with:
          title: "Test: A test release."
          files: asset.txt

      - name: Check what the cleanup kept
        run: |
          gh release list --json tagName --jq '[.[].tagName] | sort | .[]' > actual.txt
          printf '%s\n' b draft p1 p3 p4 p5 p6 stable | sort > expected.txt
          echo "Expected:"; cat expected.txt
          echo "Actual:"; cat actual.txt
          diff expected.txt actual.txt
